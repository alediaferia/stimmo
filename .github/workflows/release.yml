name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Compile translations
        run: uv run pybabel compile -d src/stimmo/locale

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Test
        run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    # Whether the private overlay's checkout secret is configured. A job-level
    # env var (rather than reading `secrets` directly in a step `if:`, which is
    # unreliable) so downstream steps can gate on a plain boolean without ever
    # touching the secret's value. Absent on forks, external contributors' runs,
    # and the org's own runs until the secret is added.
    env:
      OVERLAY_ENABLED: ${{ secrets.OVERLAY_REPO_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Editorial neighborhood blurbs live in the separate private repo
      # alediaferia/stimmo-content (see src/stimmo/data/neighborhoods.py for why:
      # stimmo is Apache-2.0, and that prose isn't licensed for redistribution).
      # Checked out into its own path, after the main checkout above - checkout's
      # default clean: true would otherwise delete this directory if the order
      # were reversed.
      - name: Check out private editorial content
        uses: actions/checkout@v6
        with:
          repository: alediaferia/stimmo-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: stimmo-content
          fetch-depth: 1
          # Only this step needs the token; don't leave it in .git/config on the
          # runner afterwards.
          persist-credentials: false

      # Mirrors the two failure modes _load_blurb_content() raises on (invalid
      # JSON; valid JSON that isn't an object), so a malformed content commit
      # fails the build here - before an image even exists - rather than
      # surfacing later as a startup crash. jq ships preinstalled on
      # ubuntu-latest. Generic over every *.json under content/ (not just
      # neighborhoods.json) so a future content file needs no workflow change.
      - name: Validate and stage private editorial content for the image build
        run: |
          set -euo pipefail
          mkdir -p var/content
          shopt -s nullglob
          for f in stimmo-content/content/*.json; do
            jq -e 'type == "object"' "$f" > /dev/null
            # Land the real content at the path the Dockerfile's optional COPY
            # looks for. var/content/*.json is never committed (see
            # .gitignore - it's licensed content); this write only ever
            # touches the working copy in the build context (context: . below
            # - not the default git context, which sends only tracked files
            # and would silently drop this).
            cp "$f" "var/content/$(basename "$f")"
          done

      # An optional private overlay may extend the app at release time - a
      # patch series maintained outside this repo, applied to the working tree
      # before the image is built. It is entirely optional: a fork, an
      # external contributor, or any run without the overlay secret configured
      # builds and deploys the plain public image, unmodified. Mirrors the
      # optional-content idiom above: skip cleanly, never fail, when the
      # private input isn't available.
      - name: Check out the private overlay repo
        if: env.OVERLAY_ENABLED == 'true'
        uses: actions/checkout@v6
        with:
          repository: alediaferia/stimmo-growth
          token: ${{ secrets.OVERLAY_REPO_TOKEN }}
          path: private-overlay
          fetch-depth: 1
          persist-credentials: false

      # The overlay's own apply script refuses to run against a dirty working
      # tree, and the private checkouts above are untracked directories inside
      # this one - which would otherwise make that guard fire on them instead
      # of on genuine uncommitted changes. Excluding them locally only affects
      # this runner's git status; it changes no tracked file.
      - name: Exclude private checkouts from this checkout's git status
        if: env.OVERLAY_ENABLED == 'true'
        run: printf '%s\n' /stimmo-content/ /private-overlay/ >> .git/info/exclude

      # Delegates entirely to the overlay repo's own apply entrypoint rather
      # than reimplementing patch application here - it already knows how to
      # apply its series and preflight its pinned base commit. Both streams
      # are captured to a runner-local file and never printed: this is a
      # public repository, its run logs are publicly readable, and the
      # series' own commit subjects and diagnostics are private. On failure,
      # only a generic notice is surfaced - the overlay repo's own CI verifies
      # the series independently and is where to diagnose a break.
      - name: Apply the private overlay, if configured
        if: env.OVERLAY_ENABLED == 'true'
        run: |
          set -euo pipefail
          if private-overlay/apply-overlay.sh "$GITHUB_WORKSPACE" "${{ github.sha }}" \
              > "$RUNNER_TEMP/overlay-apply.log" 2>&1; then
            echo "Private overlay applied."
          else
            echo "::error::Private overlay failed to apply. Its own repository verifies the series independently and is where to diagnose this - no further detail is printed here to avoid disclosing private content in this public repo's run log."
            exit 1
          fi

      # The `test` job above ran against the public tree. When an overlay is
      # applied, the tree that becomes the image is NOT the tree that was
      # tested, so test it here too - a release should not ship code nothing
      # ran. Skipped entirely when no overlay applied, since then the two trees
      # are identical and `test` already covered it.
      #
      # Output is captured, not printed, for the same reason as the apply step:
      # this repository's run logs are public, and pytest names the files and
      # tests it runs. Only a pass/fail line is surfaced.
      - name: Set up uv for the post-overlay test run
        if: env.OVERLAY_ENABLED == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Test the overlaid tree
        if: env.OVERLAY_ENABLED == 'true'
        run: |
          set -euo pipefail
          {
            uv sync --all-groups
            # .mo files are gitignored, so a fresh checkout has none and the
            # locale tests fail for reasons unrelated to the code under test.
            uv run pybabel compile -d src/stimmo/locale
            uv run pytest -q
          } > "$RUNNER_TEMP/overlay-test.log" 2>&1 && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Overlaid tree passed its test suite."
          else
            echo "::error::The overlaid tree failed its test suite, so this release was not built. Diagnose in the overlay's own repository, which runs the same suite - no detail is printed here to avoid disclosing private content in this public repo's run log."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alediaferia/stimmo
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Must stay the filesystem context (not the default git context, which
          # only sends tracked files) - the staged neighborhoods.json above is an
          # untracked working-copy overwrite and would silently vanish from the
          # image otherwise.
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Forward this run's ephemeral GITHUB_TOKEN so the VPS never needs a
          # long-lived, rotatable PAT stored via `docker login`.
          envs: DEPLOY_GH_TOKEN,DEPLOY_GH_ACTOR
          script: |
            set -euo pipefail

            IMAGE="ghcr.io/alediaferia/stimmo:${{ github.ref_name }}"

            # Authenticate fresh on every run with this workflow run's own
            # short-lived token instead of relying on a credential stored on
            # the host, which can silently rotate/expire.
            echo "$DEPLOY_GH_TOKEN" | docker login ghcr.io -u "$DEPLOY_GH_ACTOR" --password-stdin

            sed -i "s|image: ghcr.io/alediaferia/stimmo:.*|image: $IMAGE|" /opt/stimmo/docker-compose.yml
            docker compose -f /opt/stimmo/docker-compose.yml pull
            docker compose -f /opt/stimmo/docker-compose.yml up -d --remove-orphans
            docker image prune -f

            # Guard against `up -d` silently no-op'ing (e.g. `pull` not
            # actually erroring, or compose deciding nothing changed):
            # verify the running `stimmo` container is on the image we just
            # deployed before declaring success.
            CONTAINER_ID="$(docker compose -f /opt/stimmo/docker-compose.yml ps -q stimmo)"
            RUNNING_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER_ID")"
            if [ "$RUNNING_IMAGE" != "$IMAGE" ]; then
              echo "Deployed image mismatch: expected $IMAGE, running container is on $RUNNING_IMAGE" >&2
              exit 1
            fi

  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --verify-tag --generate-notes
