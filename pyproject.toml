[project]
name = "stimmo"
version = "0.1.0"
description = "Fair-price estimator for Milan property listings, based on OMI quotations and OSM amenities."
readme = "README.md"
authors = [
    { name = "Alessandro Diaferia", email = "me@alediaferia.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["real-estate", "milan", "milano", "omi", "valuation", "italy", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "geopandas>=1.1.3",
    "jinja2>=3.1.4",
    "pandas>=2.2",
    "pydantic>=2.10",
    "python-multipart>=0.0.27",
    "requests>=2.31",
    "shapely>=2.1.2",
    "uvicorn>=0.32.0",
]

[project.urls]
Homepage = "https://stimmo.it"
Repository = "https://github.com/alediaferia/stimmo"
Issues = "https://github.com/alediaferia/stimmo/issues"

[project.scripts]
stimmo-web = "stimmo.web.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # en-dash in string literals is intentional (user-visible ranges)
    "RUF002",  # multiplication sign in docstrings is intentional (math notation)
    "RUF003",  # en-dash in comments is intentional (ranges)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"scripts/**" = ["E501", "RUF005"]
