[project]
name = "stimmo"
version = "0.18.0"
description = "Fair-price estimator for Milan property listings, based on OMI quotations and OSM amenities."
readme = "README.md"
authors = [
    { name = "Alessandro Diaferia", email = "me@alediaferia.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["real-estate", "milan", "milano", "omi", "valuation", "italy", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Framework :: FastAPI",
]
dependencies = [
    "babel>=2.16",
    "fastapi>=0.139.0",
    "geopandas>=1.1.3",
    "jinja2>=3.1.4",
    "mcp>=1.28.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.31",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "uvicorn>=0.50.1",
    "prometheus-client>=0.21",
    "httpx2>=2.5.0",
    "pillow>=12.3.0",
]

[project.urls]
Homepage = "https://stimmo.it"
Repository = "https://github.com/alediaferia/stimmo"
Issues = "https://github.com/alediaferia/stimmo/issues"

[project.scripts]
stimmo-web = "stimmo.web.server:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio[trio]>=4.14.1",
    "commitizen>=4.16.4",
    "fonttools[woff]>=4.63.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # en-dash in string literals is intentional (user-visible ranges)
    "RUF002",  # multiplication sign in docstrings is intentional (math notation)
    "RUF003",  # en-dash in comments is intentional (ranges)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"scripts/**" = ["E501", "RUF005"]
