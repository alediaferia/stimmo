services:
  stimmo:
    image: ghcr.io/alediaferia/stimmo:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - stimmo-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    env_file:
      - /opt/stimmo/.env
    restart: unless-stopped
    depends_on:
      stimmo:
        condition: service_healthy
    networks:
      - stimmo-net

networks:
  stimmo-net:
    driver: bridge
