<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}stimmo{% endblock %}</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a22;
      --panel-2: #1d2230;
      --text: #e6e8ec;
      --muted: #8b93a7;
      --accent: #7aa2f7;
      --ok: #9ece6a;
      --warn: #e0af68;
      --bad: #f7768e;
      --border: #262b38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
    h2 { font-size: 1.1rem; margin: 1.75rem 0 0.75rem; }
    a { color: var(--accent); }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1rem; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    .hint { display: block; margin-top: 0.3rem; font-size: 0.78rem; color: var(--muted); line-height: 1.35; }
    label .hint { display: inline; margin: 0; font-size: 0.78rem; }
    input[type=text], input[type=number], select {
      width: 100%; padding: 0.55rem 0.7rem; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font: inherit;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .check { display: flex; align-items: center; gap: 0.5rem; padding-top: 1.2rem; }
    .check input { width: auto; }
    button {
      grid-column: 1 / -1;
      margin-top: 0.5rem;
      padding: 0.7rem 1rem;
      background: var(--accent); color: #0b0d12;
      border: 0; border-radius: 6px; font: inherit; font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 1rem;
    }
    .panel.ok { border-color: var(--ok); }
    .panel.warn { border-color: var(--warn); }
    .panel.bad { border-color: var(--bad); }
    .verdict { font-size: 1.2rem; font-weight: 700; }
    .verdict.ok { color: var(--ok); }
    .verdict.warn { color: var(--warn); }
    .verdict.bad { color: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .delta-pos { color: var(--ok); }
    .delta-neg { color: var(--bad); }
    .grid-kv { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1rem; }
    .grid-kv dt { color: var(--muted); }
    .grid-kv dd { margin: 0; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .back { display: inline-block; margin-top: 1rem; }
    .err { color: var(--bad); }
    .map { height: 420px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1.5rem; background: var(--panel); }
    .leaflet-container { background: #0b0d12; }
    .map-legend {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; color: var(--muted);
      margin: -0.75rem 0 1rem;
    }
    .map-legend .bar {
      flex: 1; height: 8px; border-radius: 4px;
      background: linear-gradient(to right, #2c7bb6, #abd9e9, #ffffbf, #fdae61, #d7191c);
    }
    .zone-popup { color: #0b0d12; font-size: 0.85rem; }
    .zone-popup strong { display: block; margin-bottom: 0.2rem; }
    .panel h3 { margin-top: 0; }
    footer { text-align: center; padding: 1.5rem 0 2rem; border-top: 1px solid var(--border); margin-top: 3rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>stimmo</h1>
      <p>Milan property fair-price estimator — OMI quotations + OSM amenities &middot; <a href="/about">about the data</a></p>
    </header>
    {% block content %}{% endblock %}
  </main>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  {% block scripts %}{% endblock %}
  <footer>
    <small class="muted">
      Data: OMI / Agenzia delle Entrate (IODL 2.0) &middot;
      &copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap contributors</a> (ODbL)
    </small>
  </footer>
</body>
</html>
